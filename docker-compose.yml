# Tagzheimer — full-stack docker-compose (v3 — Supabase edition)
#
# No MongoDB container needed! Supabase is the database (hosted).
# Spins up:
#   - Tagzheimer backend (Express + Supabase client)
#   - Tagzheimer frontend (nginx-served SPA)
#
# Usage:
#   1. cp .env.example .env  → fill in JWT_SECRET + Supabase credentials
#   2. docker compose up -d --build
#   3. Frontend: http://localhost:8080
#      Backend:  http://localhost:5000/api/health
#
# For production: put behind a reverse proxy (Caddy/Traefik) with TLS.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # Secrets — set in .env
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Supabase (required in production)
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?SUPABASE_SERVICE_KEY is required}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET is required}
      # CORS — the frontend's origin
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      # Demo mode — set to "true" to skip Supabase (uses in-memory store)
      DEMO_MODE: ${DEMO_MODE:-false}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Bake the backend URL into the production bundle.
        # Caregivers can still override at runtime via Profile → Backend Settings.
        VITE_API_URL: ${BACKEND_PUBLIC_URL:-http://localhost:5000}
        # Supabase config (also baked in — used by the frontend for auth)
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    # No env vars needed at runtime — Vite bakes them in at build time.
